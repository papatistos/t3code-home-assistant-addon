name: Build add-on

on:
  push:
    branches: [main]
    paths: ["t3code/**", ".github/workflows/builder.yaml"]
  pull_request:
    paths: ["t3code/**", ".github/workflows/builder.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test source build
        uses: home-assistant/builder@624299e7dd9fcd763ea8a39b719809ab3674c405
        with:
          args: |
            --test \
            --${{ matrix.arch }} \
            --target t3code
